name: Build T117 FDL1 & FDL2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC Toolchain
        run: |
          choco install gcc-arm-embedded -y --no-progress
          echo "C:\Program Files (x86)\GNU Arm Embedded Toolchain\10 2021.10\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build t117_fdl1.bin and t117_fdl2_hdr.bin
        shell: pwsh
        run: |
          $dir = (Get-ChildItem -Recurse -Filter "ums9117_fdl1.ld").DirectoryName
          Set-Location $dir
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null

          make clean
          make SDRAM_INIT=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fdl1 = Get-ChildItem -Recurse -Filter "*fdl1*.bin" | Select-Object -First 1
          Copy-Item $fdl1.FullName "$env:GITHUB_WORKSPACE\dist\t117_fdl1.bin"

          make clean
          make FDL2=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fdl2 = Get-ChildItem -Recurse -Filter "*fdl2*.bin" | Select-Object -First 1
          $raw = [IO.File]::ReadAllBytes($fdl2.FullName)
          $hdr = New-Object byte[] 512
          [Text.Encoding]::ASCII.GetBytes("DHTB").CopyTo($hdr, 0)
          $hdr.SetValue([byte]1, 4)
          [BitConverter]::GetBytes([uint32]$raw.Length).CopyTo($hdr, 0x30)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\dist\t117_fdl2_hdr.bin", $hdr + $raw)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }} (T117 FDL1 + FDL2)
          files: |
            dist/t117_fdl1.bin
            dist/t117_fdl2_hdr.bin
