name: Build T117 FDL1 & FDL2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC Toolchain
        run: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Build t117_fdl1.bin and t117_fdl2_hdr.bin
        run: |
          DIR=$(dirname $(find . -name "ums9117_fdl1.ld" | head -n 1))
          cd "$DIR"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          make clean
          make CC=arm-none-eabi-gcc OBJCOPY=arm-none-eabi-objcopy SDRAM_INIT=0
          cp "$(find . -name '*fdl1*.bin' | head -n 1)" "$GITHUB_WORKSPACE/dist/t117_fdl1.bin"

          make clean
          make CC=arm-none-eabi-gcc OBJCOPY=arm-none-eabi-objcopy FDL2=1
          FDL2_BIN=$(find . -name '*fdl2*.bin' | head -n 1)
          python3 -c "
          import struct
          raw = open('$FDL2_BIN', 'rb').read()
          hdr = bytearray(512)
          hdr[:4] = b'DHTB'
          hdr.__setitem__(4, 1)
          struct.pack_into('<I', hdr, 0x30, len(raw))
          open('$GITHUB_WORKSPACE/dist/t117_fdl2_hdr.bin', 'wb').write(hdr + raw)
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (T117 FDL1 + FDL2)"
          files: |
            dist/t117_fdl1.bin
            dist/t117_fdl2_hdr.bin
