name: Build t117_fdl1 (SDRAM_INIT=0)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: choco install gcc-arm-embedded -y

      - name: Build t117_fdl1.bin with SDRAM_INIT=0
        shell: pwsh
        run: |
          $dir = (Get-ChildItem -Recurse -Filter "ums9117_fdl1.ld").DirectoryName
          cd $dir
          make TOOLCHAIN=arm-none-eabi EXTRA_CFLAGS="-DSDRAM_INIT=0"
          mkdir $env:GITHUB_WORKSPACE\dist
          copy t117_fdl1.bin $env:GITHUB_WORKSPACE\dist\

      - name: Upload t117_fdl1.bin
        uses: actions/upload-artifact@v4
        with:
          name: t117_fdl1-psram
          path: dist/t117_fdl1.bin
