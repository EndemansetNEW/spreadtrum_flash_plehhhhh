name: Combine FDL1 & FDL2 Release

on:
  workflow_run:
    workflows:
      - "Build t117_fdl1 (SDRAM_INIT=0 + read_flash)"
      - "Build t117_fdl2"
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts from completed workflows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Flatten files into dist/
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish Combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.workflow_run.head_sha }}
          name: Build (${{ github.event.workflow_run.head_sha }})
          files: dist/*
